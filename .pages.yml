media:
  input: apps/web/public
  output: /

content:
  - name: profile
    label: Profile and contact
    type: file
    path: apps/web/content/profile.json
    format: json
    operations:
      delete: false
    fields:
      - { name: name, label: Full name, type: string, required: true }
      - { name: firstName, label: First name, type: string, required: true }
      - { name: lastName, label: Last name, type: string, required: true }
      - { name: email, label: Email, type: string, required: true }
      - { name: location, label: Location, type: string, required: true }
      - { name: linkedin, label: LinkedIn URL, type: string, required: true }
      - name: professionalPortrait
        label: Professional portrait
        type: image
        options:
          input: apps/web/public/media/profile
          output: /media/profile
      - name: photographyPortrait
        label: Photography portrait
        type: image
        options:
          input: apps/web/public/media/profile
          output: /media/profile
      - {
          name: available,
          label: Available for work,
          type: boolean,
          default: true,
        }
      - { name: availabilityLabel, label: Availability label, type: string }

  - name: timeline
    label: Professional timeline
    type: file
    path: apps/web/content/experiences.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - {
          name: company,
          label: Company or milestone,
          type: string,
          required: true,
        }
      - { name: role, label: Role, type: string, required: true }
      - { name: startDate, label: Start date, type: date, required: true }
      - { name: endDate, label: End date, type: date }
      - { name: summary, label: Summary, type: text, required: true }

  - name: professionalPage
    label: Professional page
    type: file
    path: apps/web/content/professional.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: introduction, label: Introduction, type: text }
      - { name: statement, label: Statement, type: text }
      - name: experience
        label: Experience section
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: introduction, label: Introduction, type: text }
      - name: contact
        label: Contact section
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }

  - name: photographyPage
    label: Photography page
    type: file
    path: apps/web/content/photography-page.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: introduction, label: Introduction, type: text }

  - name: personalPage
    label: Personal page
    type: file
    path: apps/web/content/personal.json
    format: json
    operations:
      delete: false
    fields:
      - name: hero
        label: Hero
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: introduction, label: Introduction, type: text }
      - name: timeline
        label: Timeline section
        type: object
        fields:
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: introduction, label: Introduction, type: text }
      - name: family
        label: Family section
        type: object
        fields:
          - { name: title, label: Title, type: string }
          - { name: introduction, label: Introduction, type: text }
      - { name: flightTitle, label: Flight title, type: string }
      - { name: cookingTitle, label: Cooking title, type: string }

  - name: photography
    label: Photography
    type: file
    path: apps/web/content/photography.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - name: src
        label: Photograph
        type: image
        required: true
        options:
          input: apps/web/public/media/photography
          output: /media/photography
      - { name: location, label: Location, type: string }
      - { name: year, label: Year taken, type: number }

  - name: places
    label: Places visited
    type: file
    path: apps/web/content/places.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: name, label: Place, type: string, required: true }
      - { name: country, label: Country, type: string, required: true }
      - { name: visitedAt, label: Visit date, type: date }
      - { name: description, label: Description, type: text }

  - name: lifeEvents
    label: Life events
    type: file
    path: apps/web/content/life-events.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: title, label: Title, type: string, required: true }
      - { name: eventAt, label: Date, type: date }
      - { name: location, label: Location, type: string }
      - { name: description, label: Description, type: text }

  - name: flights
    label: Flights
    type: file
    path: apps/web/content/flights.json
    format: json
    list: true
    operations:
      delete: false
    fields:
      - { name: name, label: Flight name, type: string, required: true }
      - { name: flownAt, label: Date, type: date, required: true }
      - { name: launchName, label: Launch, type: string, required: true }
      - {
          name: distanceMeters,
          label: Distance in metres,
          type: number,
          required: true,
        }
      - {
          name: durationSeconds,
          label: Duration in seconds,
          type: number,
          required: true,
        }
      - {
          name: maxAltitudeMeters,
          label: Maximum altitude in metres,
          type: number,
          required: true,
        }
      - {
          name: maxSpeedKph,
          label: Maximum speed in km/h,
          type: number,
          required: true,
        }
      - name: trace
        label: GPX or IGC trace
        type: file
        options:
          input: apps/web/public/media/flights
          output: /media/flights
          extensions: [gpx, igc]
